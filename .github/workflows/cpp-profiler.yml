# .github/workflows/cpp-profiler.yml
name: C++ Profiler – x86_64 + ARM64 (Docker build)
on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, closed ]

jobs:
  test-platform:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm64]
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-latest-arm64
            arch: arm64

    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.arch }} (Docker build)

    permissions:
      contents: read
      packages: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Build test binary
        run: |
          docker run --rm \
            -v "$(pwd)":/workspace \
            -w /workspace \
            ghcr.io/boxtob/cpp-perf-action:1.2.0 \
            bash -c "
              cmake -B _build -S . -DCMAKE_INSTALL_PREFIX=_install && \
              cmake --build _build --target install && \
              file _install/bin/hotspot_leak && \
              ldd _install/bin/hotspot_leak | head -5
            "      

      - name: Copy binary from Docker volume to workspace
        run: |
          cp _install/bin/hotspot_leak .
          chmod +x hotspot_leak
          file hotspot_leak

      - name: Make executable
        run: chmod +x hotspot_leak

      - name: Run C++ Profiler (${{ matrix.arch }})
        id: profiler
        uses: boxtob/cpp-perf-action@v1.2.0
        with:
          binaries: hotspot_leak
          valgrind-memcheck: true
          valgrind-callgrind: true
          valgrind-cachegrind: true
          gperftools: true
          fail-on-leak: true
          run-args: --verbose

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profiling-results
          path: ${{ steps.profiler.outputs.artifacts }}