# .github/workflows/cpp-profiler.yml
name: C++ Profiler – x86_64 + ARM64 (Docker build)
on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, closed ]

jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.arch }} (Docker build)

    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - name: Build test binary
        run: |
          mkdir _install
          docker build -t test-builder build
          docker run --rm \
            -v $(pwd):/workspace \
            -w /workspace \
            test-builder \
            bash -c "
              cmake -B _build -S . -DCMAKE_INSTALL_PREFIX=_install && \
              cmake --build _build --target install && \
              file _install/bin/hotspot_leak && \
              ldd _install/bin/hotspot_leak | head -5
            "

      - name: Copy binary from Docker volume to workspace
        run: |
          cp _install/bin/hotspot_leak .
          chmod +x hotspot_leak
          file hotspot_leak

      - name: Upload binary
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: test-binary-${{ matrix.arch }}
          path: _install/bin/hotspot_leak


  test-platform:
    needs: build
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.arch }} (Docker profile)

    permissions:
      contents: read
      packages: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Download test binary
        uses: actions/download-artifact@v4
        with:
          name: test-binary-${{ matrix.arch }}
          path: .

      - name: Make executable
        run: chmod +x hotspot_leak      

      - name: Run C++ Profiler (${{ matrix.arch }})
        id: profiler
        uses: boxtob/cpp-perf-action@v1.2.3
        with:
          binaries: hotspot_leak
          valgrind-memcheck: true
          valgrind-callgrind: true
          valgrind-cachegrind: true
          gperftools: true
          fail-on-leak: true
          run-args: --verbose

      - name: Fix artifact ownership
        run: |
          ls -la .
          sudo chown -R $USER:$USER "${{ steps.profiler.outputs.artifacts }}"
          ls -la "${{ steps.profiler.outputs.artifacts }}"          

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profiling-results
          path: ${{ steps.profiler.outputs.artifacts }}