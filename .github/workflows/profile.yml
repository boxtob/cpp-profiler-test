name: C++ Performance Profiling
on:
  pull_request:
    branches: [ main ]

jobs:
  trigger:
      runs-on: ubuntu-latest
      steps:
        - run: echo "Workflow triggered"

  profile:
    needs: [build, trigger]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # For annotations
    steps:
      - uses: actions/checkout@v4

      - name: Download test binary
        uses: actions/download-artifact@v4
        with:
          name: test-binary
          path: .

      - name: Make executable
        run: chmod +x test

      - name: Run C++ Profiler
        id: profiler
        uses: ./.github/actions/cpp-profiler
        with:
          binaries: test
          valgrind-memcheck: true
          valgrind-callgrind: true
          gperftools: true
          fail-on-leak: true  # Set to true to fail on leaks

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profiling-results
          path: ${{ steps.profiler.outputs.artifacts }}
