# .github/workflows/build-test.yml
name: Build Test Binary
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'test.cpp'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - name: Build test binary in Docker
        run: |
          docker build -t cpp-profiler-builder .github/actions/cpp-profiler
          docker run --rm \
            -v $(pwd):/workspace \
            -w /workspace \
            cpp-profiler-builder \
            g++ -g -O0 -Wl,--no-as-needed -lprofiler test.cpp -o test

      - name: Upload binary
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: test-binary
          path: test